# Produção na VM (atrás do Traefik). Ver README.md.
#   docker compose -p cartografia-prod -f docker-compose.prod.yml up -d
# Sem build e sem banco: o Caddy serve site/ direto do checkout, então o git pull já publica.
# Monta pastas, não arquivos: o git troca o arquivo (inode novo) e um bind de arquivo ficaria
# preso na versão antiga.
name: cartografia-prod

# Rotação de logs: padrão da VPS (/opt/infra/README.md).
x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

services:
  web:
    image: caddy:2-alpine
    container_name: cartografia-prod-web
    restart: unless-stopped
    logging: *logging
    volumes:
      - ./site:/srv:ro
      - ./caddy:/etc/caddy:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      # O Traefik não roteia para container "starting": checa a cada 2 s na subida.
      start_interval: 2s
      retries: 3
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.cartografia.rule=Host(`cartografia.rudyson.com.br`)"
      - "traefik.http.routers.cartografia.entrypoints=websecure"
      - "traefik.http.routers.cartografia.tls.certresolver=le"
      - "traefik.http.services.cartografia.loadbalancer.server.port=80"

networks:
  traefik-public:
    external: true
